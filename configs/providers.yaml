# 遥感数据源配置
# type: stac | usgs_m2m | cdse_odata
# fetch_mode: vsi | download | windowed
#   vsi      —— rasterio 云端按需读取，不落盘；默认经本地 Range 代理转发，
#              避开 Windows 上 GDAL vsicurl 的 schannel TLS 故障，
#              只拉取窗口命中的 COG 瓦片（推荐）。
#   download —— 经 httpx 完整下载到 raw/（断点续传）
#   windowed —— 按 AOI 窗口裁剪后落盘

providers:

  # ── Element 84 Earth Search（完全公开，零凭证可用）────────────────
  # Sentinel-2 L2A / Landsat C2 L2 的公开 COG，开箱即用。
  earth-search:
    type: stac
    url: https://earth-search.aws.element84.com/v1
    collections:
      - sentinel-2-l2a
    auth: none
    fetch_mode: vsi
    enabled: true

  # ── Microsoft Planetary Computer（免账号，免费 SAS 签名）──────────
  # Landsat C2 L2 / Sentinel-2 的 Azure Blob COG，资产需 SAS token，
  # rspipe 会自动调 PC 免费签名接口（见 ingest/signing.py）。
  planetary-computer:
    type: stac
    url: https://planetarycomputer.microsoft.com/api/stac/v1
    collections:
      - landsat-c2-l2
    auth: none
    fetch_mode: vsi
    enabled: true

  # ── USGS LandsatLook STAC ─────────────────────────────────────────
  # 检索公开；资产下载需 USGS EROS 账号（会跳登录页）。
  # 填入 .env 中的 USGS_M2M_USERNAME / USGS_M2M_TOKEN 后可用。
  usgs-landsat:
    type: stac
    url: https://landsatlook.usgs.gov/stac-server
    collections:
      - landsat-c2l2-sr
    auth: none
    fetch_mode: download
    enabled: true

  # ── Copernicus Data Space Ecosystem STAC ──────────────────────────
  # 需 OAuth2 client credentials（CDSE_CLIENT_ID / CDSE_CLIENT_SECRET）。
  cdse-s2:
    type: stac
    url: https://catalogue.dataspace.copernicus.eu/stac
    collections:
      - sentinel-2-l2a
    auth: oauth2
    token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
    fetch_mode: download
    enabled: true

  # ── 补充客户端（默认关闭）─────────────────────────────────────────
  usgs-m2m:
    type: usgs_m2m
    auth: m2m_token
    datasets:
      - landsat_ot_c2_l2
    fetch_mode: download
    enabled: false

  cdse-odata:
    type: cdse_odata
    auth: oauth2
    base_url: https://catalogue.dataspace.copernicus.eu/odata/v1
    s3_endpoint: https://eodata.dataspace.copernicus.eu
    fetch_mode: download
    enabled: false
