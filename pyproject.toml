[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rspipe"
version = "1.1.0"
description = "Landsat / Sentinel-2 ingestion, normalization, COG conversion, cloud removal, color balancing, seamless mosaicking and STAC metadata pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rspipe contributors" }]
keywords = ["remote-sensing", "landsat", "sentinel-2", "cog", "stac", "gdal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3.9",
    "rioxarray>=0.15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=0.14",
    "rio-cogeo>=5.3",
    "pystac[validation]>=1.10",
    "rio-stac>=0.10",
    "pystac-client>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "APScheduler>=3.10",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pillow>=10.0",
]

[project.optional-dependencies]
m2m = ["usgsxplore>=1.1"]
s3 = ["boto3>=1.34"]
s2cloudless = ["s2cloudless>=1.7", "lightgbm>=4.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
rspipe = "rspipe.cli:app"

[project.urls]
Homepage = "https://github.com/srmaper/rspipe"
Repository = "https://github.com/srmaper/rspipe"
Issues = "https://github.com/srmaper/rspipe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rspipe = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "PTH"]
ignore = [
    "E501",
    "RUF001",  # 中文标点在字符串/注释中合法
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/rspipe"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require real provider credentials and network access",
]
filterwarnings = ["ignore::DeprecationWarning"]
